  <style>
    :root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#64748b;--line:#e2e8f0;--blue:#2563eb;--green:#16a34a;--amber:#d97706;--red:#dc2626;--purple:#7c3aed}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
    header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
    .wrap{max-width:1260px;margin:auto;padding:22px}.top{display:flex;gap:18px;justify-content:space-between;align-items:center}.brand{display:flex;gap:12px;align-items:center}.logo{width:46px;height:46px;border-radius:16px;background:linear-gradient(135deg,#2563eb,#14b8a6);display:grid;place-items:center;color:white;font-weight:900}.brand h1{font-size:24px;margin:0}.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:11px 14px;background:#e2e8f0;color:#0f172a;font-weight:700;cursor:pointer}.btn.primary{background:var(--blue);color:white}.btn.green{background:var(--green);color:white}.btn.red{background:#fee2e2;color:#991b1b}.btn:hover{filter:brightness(.96)}
    main{max-width:1260px;margin:auto;padding:22px}.grid{display:grid;grid-template-columns:1.45fr .9fr;gap:20px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:16px}.tab{border:1px solid var(--line);background:white;border-radius:999px;padding:10px 14px;cursor:pointer;color:#475569;font-weight:700;white-space:nowrap}.tab.active{background:#111827;color:white;border-color:#111827}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 10px 25px rgba(15,23,42,.045);margin-bottom:16px}.card h2{margin:0 0 14px;font-size:20px}.card h3{margin:18px 0 10px;font-size:15px;color:#334155;text-transform:uppercase;letter-spacing:.04em}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field label{display:block;font-size:12px;font-weight:800;color:#475569;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff;font-size:14px}.field textarea{min-height:74px;resize:vertical}.full{grid-column:1/-1}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.metric{background:#f8fafc;border:1px solid var(--line);border-radius:16px;padding:14px}.metric b{display:block;font-size:23px}.metric span{color:var(--muted);font-size:12px;font-weight:700}.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.check{display:flex;align-items:center;gap:8px;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:9px;font-size:13px}.check input{width:16px;height:16px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left}th{background:#f8fafc;color:#475569;font-size:12px;text-transform:uppercase;letter-spacing:.03em}td input{width:80px;border:1px solid var(--line);border-radius:10px;padding:8px}.pill{display:inline-flex;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800}.greenp{background:#dcfce7;color:#166534}.amberp{background:#fef3c7;color:#92400e}.redp{background:#fee2e2;color:#991b1b}.bluep{background:#dbeafe;color:#1e40af}.note{padding:12px;border-radius:14px;background:#eff6ff;color:#1e3a8a;border:1px solid #bfdbfe;font-size:13px}.alert{padding:12px;border-radius:14px;border:1px solid;font-size:13px;margin:8px 0}.alert.red{background:#fef2f2;color:#991b1b;border-color:#fecaca}.alert.yellow{background:#fffbeb;color:#92400e;border-color:#fde68a}.alert.green{background:#f0fdf4;color:#166534;border-color:#bbf7d0}.side{position:sticky;top:105px}.chart{width:190px;height:190px;border-radius:50%;margin:auto;background:conic-gradient(#2563eb 0 var(--p),#16a34a var(--p) calc(var(--p) + var(--g)),#f59e0b calc(var(--p) + var(--g)) 100%);display:grid;place-items:center}.chart .inner{width:122px;height:122px;border-radius:50%;background:white;display:grid;place-items:center;text-align:center;border:1px solid var(--line)}.meal{border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;background:#fff}.meal h4{margin:0 0 8px}.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{background:#eef2ff;color:#3730a3;border-radius:999px;padding:5px 8px;font-size:12px;font-weight:700}.footerwarn{font-size:12px;color:#64748b;line-height:1.5}.hidden{display:none!important}@media(max-width:920px){.grid{grid-template-columns:1fr}.side{position:static}.form,.checks,.metrics{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
    @media print{header,.tabs,.actions,.btn,.no-print{display:none!important}body{background:white}.card{box-shadow:none;break-inside:avoid}.grid{display:block}}
  </style>
</head>
<body>
<header><div class="wrap top"><div class="brand"><div class="logo">EQ</div><div><h1>EquiGen Pro</h1><p>Generador automático de planes por equivalentes</p></div></div><div class="actions"><button class="btn" onclick="loadExample()">Cargar ejemplo</button><button class="btn primary" onclick="generatePlan()">Generar plan automático</button><button class="btn green" onclick="savePlan()">Guardar</button><button class="btn" onclick="window.print()">Imprimir</button><button class="btn red" onclick="resetAll()">Limpiar</button></div></div></header>
<main>
  <div class="tabs no-print" id="tabs"></div>
  <div class="grid">
    <section>
      <div id="panel-paciente" class="panel card"></div>
      <div id="panel-clinico" class="panel card hidden"></div>
      <div id="panel-objetivo" class="panel card hidden"></div>
      <div id="panel-plan" class="panel card hidden"></div>
      <div id="panel-resumen" class="panel card hidden"></div>
    </section>
    <aside class="side"><div class="card" id="sidebar"></div></aside>
  </div>
</main>
<script>
const foodGroups=[
{id:'verduras',n:'Verduras',k:25,p:2,l:0,c:4,min:3,max:8},{id:'frutas',n:'Frutas',k:60,p:0,l:0,c:15,min:0,max:4},{id:'cereales_sg',n:'Cereales sin grasa',k:70,p:2,l:0,c:15,min:1,max:12},{id:'cereales_cg',n:'Cereales con grasa',k:115,p:2,l:5,c:15,min:0,max:4},{id:'leguminosas',n:'Leguminosas',k:120,p:8,l:1,c:20,min:0,max:4},{id:'aoa_mbg',n:'AOA muy bajo grasa',k:40,p:7,l:1,c:0,min:0,max:8},{id:'aoa_bg',n:'AOA bajo grasa',k:55,p:7,l:3,c:0,min:0,max:8},{id:'aoa_mg',n:'AOA mod. grasa',k:75,p:7,l:5,c:0,min:0,max:6},{id:'aoa_ag',n:'AOA alto grasa',k:100,p:7,l:8,c:0,min:0,max:3},{id:'leche_des',n:'Leche descremada',k:95,p:9,l:2,c:12,min:0,max:2},{id:'leche_semi',n:'Leche semidesc.',k:110,p:9,l:4,c:12,min:0,max:2},{id:'leche_ent',n:'Leche entera',k:150,p:9,l:8,c:12,min:0,max:1},{id:'leche_azu',n:'Leche con azúcar',k:200,p:8,l:5,c:30,min:0,max:1},{id:'aceites_sp',n:'Aceites sin proteína',k:45,p:0,l:5,c:0,min:1,max:8},{id:'aceites_cp',n:'Aceites con proteína',k:70,p:3,l:5,c:3,min:0,max:3},{id:'azucar_sg',n:'Azúcar sin grasa',k:40,p:0,l:0,c:10,min:0,max:2},{id:'azucar_cg',n:'Azúcar con grasa',k:85,p:0,l:5,c:10,min:0,max:1}];
const patologias=['Diabetes','Prediabetes','Hipertensión','Dislipidemia','Enfermedad renal','Enfermedad cardiovascular','Hígado graso','Cirrosis','Hipotiroidismo','SOP','Cáncer activo','Cirugía bariátrica','Embarazo/lactancia','Trastorno de conducta alimentaria','Alergias alimentarias','Intolerancias','Reflujo/gastritis','Colitis','Estreñimiento'];
const medicamentos=['Insulina','Sulfonilureas','Metformina','Semaglutida/tirzepatida/GLP-1','SGLT2','Corticoides','Diuréticos','Antihipertensivos','Estatinas/fibratos','Levotiroxina','Anticoagulantes','Suplementos'];
const labs=['Glucosa','HbA1c','Colesterol total','LDL','HDL','Triglicéridos','Creatinina','eGFR','Urea','AST','ALT','GGT','TSH','Albúmina','Ácido úrico'];
const objetivos=['Alimentación saludable','Pérdida de grasa','Pérdida de grasa intensiva supervisada','Ganancia muscular','Recomposición corporal','Diabetes/prediabetes','Síndrome metabólico','Hipertensión','Dislipidemia','Hígado graso','Enfermedad renal','Deportista','Vegetariano/vegano'];
const recipes=[['Huevos con nopales y tortilla','Desayuno','AOA moderado 2, verduras 1, cereales 2'],['Avena con leche descremada y fruta','Desayuno / colación','Cereal 1, leche descremada 1, fruta 1'],['Tacos de pollo con verduras','Comida / cena','AOA bajo grasa 3, cereales 2, verduras 2, aceite 1'],['Ensalada de atún con tostadas horneadas','Comida / cena','AOA muy bajo 3, cereales 2, verduras 2, aceite 1'],['Pechuga de pollo con arroz y ensalada','Comida','AOA bajo grasa 3, cereales 2, verduras 2, aceite 1'],['Frijoles con tortilla y pico de gallo','Comida','Leguminosa 1, cereales 2, verduras 1'],['Yogur natural con fruta','Colación','Leche descremada 1, fruta 1'],['Quesadillas con champiñones','Cena','Cereales 2, AOA moderado 1, verduras 1'],['Bowl de lentejas con verduras','Comida','Leguminosa 1, verduras 2, cereal 1, aceite 1'],['Licuado alto en proteína','Colación','Leche descremada 1, fruta 1, AOA muy bajo 1']];
let S={tab:'paciente',patient:{nombre:'',edad:30,sexo:'femenino',peso:70,estatura:160,cintura:80,cadera:100,actividad:'sedentario',comidas:5,presupuesto:'medio',ocupacion:'',exclusiones:'',grasa:'',musculo:'',agua:'',osea:'',visceral:'',metabolica:'',bmr:''},clinical:{pat:{},med:{},lab:{}},objetivo:'Pérdida de grasa',plan:null,eq:{}};
const $=id=>document.getElementById(id); const n=v=>Number(v)||0; const round=(x,d=0)=>Number((x||0).toFixed(d));
function persist(){localStorage.setItem('equigen-preview',JSON.stringify(S))} function restore(){try{Object.assign(S,JSON.parse(localStorage.getItem('equigen-preview')||'{}'))}catch(e){}}
function setTab(t){S.tab=t;render();persist()} function upd(path,val){let o=S;path.split('.').slice(0,-1).forEach(k=>o=o[k]);o[path.split('.').pop()]=val;render();persist()}
function bmi(){return S.patient.peso/Math.pow(S.patient.estatura/100,2)||0} function whr(){return S.patient.cintura/S.patient.cadera||0}
function risk(){let p=S.clinical.pat,m=S.clinical.med,egfr=n(S.clinical.lab.eGFR); if(p['Embarazo/lactancia']||p['Cáncer activo']||p['Cirrosis']||p['Cirugía bariátrica']||p['Trastorno de conducta alimentaria']||m['Insulina']||m['Sulfonilureas']||bmi()<18.5||(p['Enfermedad renal']&&!egfr))return 'alto'; if(p['Diabetes']||p['Prediabetes']||p['Hipertensión']||p['Dislipidemia']||p['Hígado graso']||bmi()>=30)return 'moderado'; return 'bajo'}
function energy(){let P=S.patient,ger=10*n(P.peso)+6.25*n(P.estatura)-5*n(P.edad)+(P.sexo==='masculino'?5:-161);let f={sedentario:1.2,ligero:1.35,moderado:1.55,alto:1.75,muy_alto:1.9}[P.actividad]||1.2;let get=ger*f,aj=0;if(['Pérdida de grasa'].includes(S.objetivo))aj=-.15;if(S.objetivo==='Pérdida de grasa intensiva supervisada')aj=-.20;if(S.objetivo==='Ganancia muscular'||S.objetivo==='Deportista')aj=.10;if(S.objetivo==='Recomposición corporal')aj=-.05;if(['Diabetes/prediabetes','Síndrome metabólico','Hipertensión','Dislipidemia','Hígado graso'].includes(S.objetivo)&&bmi()>=25)aj=-.10;return{ger:round(ger),get:round(get),aj,kcal:round(get*(1+aj))}}
function macros(kcal){let kg=n(S.patient.peso),pr=1,gr=.30;if(S.objetivo.includes('Pérdida')){pr=S.objetivo.includes('intensiva')?1.6:1.4;gr=.30}else if(['Ganancia muscular','Deportista'].includes(S.objetivo)){pr=1.8;gr=.25}else if(S.objetivo==='Recomposición corporal'){pr=1.6;gr=.30}else if(['Diabetes/prediabetes','Síndrome metabólico'].includes(S.objetivo)){pr=1.2;gr=.35}else if(['Hipertensión','Dislipidemia'].includes(S.objetivo)){pr=1.1;gr=.30}else if(S.objetivo==='Hígado graso'){pr=1.2;gr=.30}else if(S.objetivo==='Vegetariano/vegano'){pr=1.2;gr=.30}let pg=kg*pr,pk=pg*4,gk=kcal*gr,gg=gk/9,ck=Math.max(0,kcal-pk-gk),cg=ck/4;return{pg:round(pg),pk:round(pk),pp:round(pk/kcal*100),gg:round(gg),gk:round(gk),gp:round(gk/kcal*100),cg:round(cg),ck:round(ck),cp:round(ck/kcal*100)}}
function totals(eq){let t={k:0,p:0,l:0,c:0};foodGroups.forEach(g=>{let q=n(eq[g.id]);t.k+=q*g.k;t.p+=q*g.p;t.l+=q*g.l;t.c+=q*g.c});t.k=round(t.k);t.p=round(t.p,1);t.l=round(t.l,1);t.c=round(t.c,1);return t}
function score(eq,E,M){let T=totals(eq);let s=Math.abs(T.k-E.kcal)+Math.abs(T.p-M.pg)*8+Math.abs(T.l-M.gg)*4+Math.abs(T.c-M.cg)*3;if(n(eq.verduras)<3)s+=50;if((S.clinical.pat.Diabetes||S.clinical.pat.Prediabetes)&&(n(eq.azucar_sg)+n(eq.azucar_cg)+n(eq.leche_azu)>0))s+=180;if(S.clinical.pat.Dislipidemia&&n(eq.aoa_ag)>1)s+=80;if(T.k<E.ger&&S.objetivo!=='Pérdida de grasa intensiva supervisada')s+=100;if(S.clinical.pat['Enfermedad renal']&&!n(S.clinical.lab.eGFR))s+=300;if((S.clinical.pat.Diabetes||S.clinical.pat.Prediabetes)&&n(eq.frutas)>3)s+=40;return s}
function generateEquivalents(E,M){let eq={verduras:3,frutas:2,cereales_sg:4,cereales_cg:0,leguminosas:1,aoa_mbg:0,aoa_bg:3,aoa_mg:0,aoa_ag:0,leche_des:1,leche_semi:0,leche_ent:0,leche_azu:0,aceites_sp:3,aceites_cp:0,azucar_sg:0,azucar_cg:0}; if(S.objetivo==='Ganancia muscular'){eq.aoa_bg=5;eq.cereales_sg=6;eq.leche_des=2} if(S.objetivo.includes('Diabetes')){eq.frutas=1.5;eq.leguminosas=1.5;eq.verduras=4;eq.azucar_sg=0;eq.azucar_cg=0;eq.leche_azu=0} let best={...eq},bs=score(best,E,M); for(let i=0;i<500;i++){let improved=false; for(const g of foodGroups){for(const d of[-.5,.5]){let cand={...best,[g.id]:Math.max(g.min,Math.min(g.max,round(n(best[g.id])+d,1)))};let sc=score(cand,E,M); if(sc<bs){best=cand;bs=sc;improved=true}}} if(!improved)break} return best}
function distribute(eq){let names={3:['Desayuno','Comida','Cena'],4:['Desayuno','Colación','Comida','Cena'],5:['Desayuno','Colación 1','Comida','Colación 2','Cena'],6:['Desayuno','Colación 1','Comida','Colación 2','Cena','Colación nocturna']}[S.patient.comidas];let pct={3:[.3,.4,.3],4:[.25,.15,.4,.2],5:[.25,.1,.35,.1,.2],6:[.2,.1,.3,.1,.2,.1]}[S.patient.comidas];let dist={};names.forEach((name,i)=>{dist[name]={};foodGroups.forEach(g=>{let q=round(n(eq[g.id])*pct[i]*2)/2;if(q>0)dist[name][g.id]=q})});return dist}
function alerts(E,M,eq){let a=[],T=totals(eq),r=risk(); if(r==='alto')a.push(['red','Paciente de alto riesgo: requiere validación profesional cuidadosa antes de entregar el plan.']); if(E.aj<=-.2)a.push(['yellow','Déficit energético intensivo: confirmar tolerancia, adherencia y seguimiento.']); if(T.k<E.ger)a.push(['yellow','La energía del plan quedó por debajo del GER estimado. Revisar antes de aprobar.']); if((S.clinical.pat.Diabetes||S.clinical.pat.Prediabetes)&&(n(eq.azucar_sg)+n(eq.azucar_cg)+n(eq.leche_azu)>0))a.push(['red','Paciente con alteración glucémica y azúcares asignados: revisar pertinencia.']); if((S.clinical.med.Insulina||S.clinical.med.Sulfonilureas))a.push(['red','Usa insulina o sulfonilureas: distribuir carbohidratos y prevenir hipoglucemia.']); if(S.clinical.pat['Enfermedad renal']&&!n(S.clinical.lab.eGFR))a.push(['red','Enfermedad renal sin eGFR: no recomendar proteína alta sin dato renal.']); if(n(eq.verduras)<3)a.push(['yellow','Verduras menores de 3 equivalentes: considerar aumentar fibra y volumen.']); if(S.clinical.pat.Dislipidemia&&n(eq.aoa_ag)>1)a.push(['yellow','Dislipidemia con AOA alto en grasa elevado: preferir proteína magra.']); if(!a.length)a.push(['green','Plan generado sin alertas mayores. Aun así requiere revisión del nutriólogo.']);return a}
function generatePlan(){let E=energy(),M=macros(E.kcal),eq=generateEquivalents(E,M);S.eq=eq;S.plan={E,M,T:totals(eq),dist:distribute(eq),alerts:alerts(E,M,eq),risk:risk()};S.tab='plan';render();persist()}
function updateEq(id,val){S.eq[id]=Number(val)||0;if(S.plan){let E=energy(),M=macros(E.kcal);S.plan={E,M,T:totals(S.eq),dist:distribute(S.eq),alerts:alerts(E,M,S.eq),risk:risk()}}render();persist()}
function loadExample(){S.patient={nombre:'Paciente ejemplo',edad:38,sexo:'femenino',peso:82,estatura:158,cintura:96,cadera:108,actividad:'ligero',comidas:5,presupuesto:'medio',ocupacion:'Administrativa',exclusiones:'Refresco, pan dulce',grasa:39,musculo:27,agua:45,osea:2.6,visceral:12,metabolica:48,bmr:''};S.clinical={pat:{Prediabetes:true,Dislipidemia:true},med:{Metformina:true},lab:{HbA1c:'5.9','Triglicéridos':'190',Creatinina:'0.8',eGFR:'95'}};S.objetivo='Pérdida de grasa';generatePlan()}
function savePlan(){persist();alert('Plan guardado en este navegador.')} function resetAll(){if(confirm('¿Limpiar todos los datos?')){localStorage.removeItem('equigen-preview');location.reload()}}
function renderTabs(){let names=[['paciente','Paciente'],['clinico','Clínico'],['objetivo','Objetivo'],['plan','Equivalentes'],['resumen','Resumen']];$('tabs').innerHTML=names.map(x=>`<button class="tab ${S.tab===x[0]?'active':''}" onclick="setTab('${x[0]}')">${x[1]}</button>`).join('');document.querySelectorAll('.panel').forEach(p=>p.classList.add('hidden'));$(`panel-${S.tab}`).classList.remove('hidden')}
function input(path,label,type='text',opts=''){let val=path.split('.').reduce((o,k)=>o?.[k],S)??''; if(type==='select')return `<div class="field"><label>${label}</label><select onchange="upd('${path}',this.value)">${opts.split('|').map(o=>`<option ${val==o?'selected':''}>${o}</option>`).join('')}</select></div>`;return `<div class="field"><label>${label}</label><input type="${type}" value="${val}" oninput="upd('${path}',this.value)"></div>`}
function renderPaciente(){let P=S.patient;$('panel-paciente').innerHTML=`<h2>Datos del paciente</h2><div class="form">${input('patient.nombre','Nombre')}${input('patient.edad','Edad','number')}${input('patient.sexo','Sexo','select','femenino|masculino')}${input('patient.peso','Peso kg','number')}${input('patient.estatura','Estatura cm','number')}${input('patient.cintura','Cintura cm','number')}${input('patient.cadera','Cadera cm','number')}${input('patient.actividad','Actividad','select','sedentario|ligero|moderado|alto|muy_alto')}${input('patient.comidas','Comidas deseadas','select','3|4|5|6')}${input('patient.presupuesto','Presupuesto','select','bajo|medio|alto')}${input('patient.ocupacion','Ocupación')}<div class="field full"><label>Alimentos no aceptados / exclusiones</label><textarea oninput="upd('patient.exclusiones',this.value)">${P.exclusiones||''}</textarea></div></div><h3>Indicadores automáticos</h3><div class="metrics"><div class="metric"><span>IMC</span><b>${round(bmi(),1)}</b></div><div class="metric"><span>Cintura/cadera</span><b>${round(whr(),2)}</b></div><div class="metric"><span>Riesgo</span><b>${risk()}</b></div><div class="metric"><span>Comidas</span><b>${P.comidas}</b></div></div><h3>Composición corporal</h3><div class="note">La composición corporal por bioimpedancia puede variar por hidratación, ejercicio previo, temperatura y horario. Usar principalmente para seguimiento.</div><br><div class="form">${input('patient.grasa','% grasa','number')}${input('patient.musculo','% músculo','number')}${input('patient.agua','% agua','number')}${input('patient.osea','Masa ósea kg','number')}${input('patient.visceral','Grasa visceral','number')}${input('patient.metabolica','Edad metabólica','number')}${input('patient.bmr','BMR del equipo','number')}</div>`}
function renderClinico(){let c=k=>`<label class="check"><input type="checkbox" ${S.clinical.pat[k]?'checked':''} onchange="S.clinical.pat['${k}']=this.checked;render();persist()">${k}</label>`;let m=k=>`<label class="check"><input type="checkbox" ${S.clinical.med[k]?'checked':''} onchange="S.clinical.med['${k}']=this.checked;render();persist()">${k}</label>`;$('panel-clinico').innerHTML=`<h2>Interrogatorio clínico</h2><h3>Patologías</h3><div class="checks">${patologias.map(c).join('')}</div><h3>Medicamentos</h3><div class="checks">${medicamentos.map(m).join('')}</div><h3>Laboratorios</h3><div class="form">${labs.map(l=>`<div class="field"><label>${l}</label><input value="${S.clinical.lab[l]||''}" oninput="S.clinical.lab['${l}']=this.value;render();persist()"></div>`).join('')}</div>`}
function renderObjetivo(){let E=energy(),M=macros(E.kcal);$('panel-objetivo').innerHTML=`<h2>Objetivo terapéutico y cálculo energético</h2><div class="form"><div class="field full"><label>Objetivo principal</label><select onchange="S.objetivo=this.value;render();persist()">${objetivos.map(o=>`<option ${S.objetivo===o?'selected':''}>${o}</option>`).join('')}</select></div></div><h3>Motor energético</h3><div class="metrics"><div class="metric"><span>GER</span><b>${E.ger}</b></div><div class="metric"><span>GET</span><b>${E.get}</b></div><div class="metric"><span>Ajuste</span><b>${round(E.aj*100)}%</b></div><div class="metric"><span>Kcal finales</span><b>${E.kcal}</b></div></div><h3>Macronutrientes objetivo</h3><div class="metrics"><div class="metric"><span>Proteína</span><b>${M.pg} g</b></div><div class="metric"><span>Lípidos</span><b>${M.gg} g</b></div><div class="metric"><span>Carbohidratos</span><b>${M.cg} g</b></div><div class="metric"><span>Distribución</span><b>${M.pp}/${M.gp}/${M.cp}%</b></div></div><br><button class="btn primary" onclick="generatePlan()">Generar plan automático</button>`}
function renderPlan(){if(!S.plan){$('panel-plan').innerHTML='<h2>Equivalentes diarios</h2><p>No hay plan generado.</p><button class="btn primary" onclick="generatePlan()">Generar ahora</button>';return}let T=S.plan.T,E=S.plan.E,M=S.plan.M;$('panel-plan').innerHTML=`<h2>Tabla editable de equivalentes diarios</h2><div class="metrics"><div class="metric"><span>Energía</span><b>${T.k}</b></div><div class="metric"><span>Proteína</span><b>${T.p} g</b></div><div class="metric"><span>Lípidos</span><b>${T.l} g</b></div><div class="metric"><span>HC</span><b>${T.c} g</b></div></div><br><div class="note">Diferencia vs objetivo: ${T.k-E.kcal} kcal · proteína ${round(T.p-M.pg,1)} g · lípidos ${round(T.l-M.gg,1)} g · HC ${round(T.c-M.cg,1)} g</div><br><div class="tablewrap"><table><thead><tr><th>Grupo</th><th>Eq/día</th><th>Kcal</th><th>Prot</th><th>Líp</th><th>HC</th></tr></thead><tbody>${foodGroups.map(g=>{let q=n(S.eq[g.id]);return `<tr><td>${g.n}</td><td><input type="number" step="0.5" value="${q}" onchange="updateEq('${g.id}',this.value)"></td><td>${round(q*g.k)}</td><td>${round(q*g.p,1)}</td><td>${round(q*g.l,1)}</td><td>${round(q*g.c,1)}</td></tr>`}).join('')}</tbody></table></div><h3>Distribución por tiempos</h3><div class="tablewrap"><table><thead><tr><th>Comida</th><th>Equivalentes asignados</th></tr></thead><tbody>${Object.entries(S.plan.dist).map(([meal,eq])=>`<tr><td><b>${meal}</b></td><td><div class="tags">${Object.entries(eq).map(([id,q])=>`<span class="tag">${q} ${foodGroups.find(g=>g.id===id)?.n||id}</span>`).join('')}</div></td></tr>`).join('')}</tbody></table></div>`}
function renderResumen(){if(!S.plan){$('panel-resumen').innerHTML='<h2>Resumen</h2><p>Genera primero el plan.</p>';return}let A=S.plan.alerts;$('panel-resumen').innerHTML=`<h2>Resumen listo para consulta</h2>${A.map(x=>`<div class="alert ${x[0]==='red'?'red':x[0]==='yellow'?'yellow':'green'}">${x[1]}</div>`).join('')}<h3>Paciente</h3><p><b>${S.patient.nombre||'Paciente sin nombre'}</b> · ${S.patient.edad} años · ${S.patient.peso} kg · IMC ${round(bmi(),1)} · Objetivo: ${S.objetivo}</p><h3>Prescripción</h3><div class="metrics"><div class="metric"><span>Kcal</span><b>${S.plan.E.kcal}</b></div><div class="metric"><span>Proteína</span><b>${S.plan.M.pg} g</b></div><div class="metric"><span>Lípidos</span><b>${S.plan.M.gg} g</b></div><div class="metric"><span>HC</span><b>${S.plan.M.cg} g</b></div></div><h3>Menú sugerido inicial</h3>${Object.keys(S.plan.dist).map((meal,i)=>{let r=recipes[i%recipes.length];return `<div class="meal"><h4>${meal}: ${r[0]}</h4><p><b>Porciones equivalentes:</b> ${r[2]}</p><p class="footerwarn">Ajustar cantidades exactas según la tabla de equivalentes y preferencias del paciente.</p></div>`}).join('')}<h3>Nota profesional</h3><p class="footerwarn">Herramienta de apoyo para nutriólogos. El resultado es automático, editable y requiere validación profesional antes de entregarse al paciente.</p>`}
function renderSide(){let E=energy(),M=macros(E.kcal),riskClass=risk()==='alto'?'redp':risk()==='moderado'?'amberp':'greenp';$('sidebar').innerHTML=`<h2>Estado del plan</h2><div class="chart" style="--p:${M.pp}%;--g:${M.gp}%"><div class="inner"><b>${E.kcal}</b><span>kcal/día</span></div></div><br><div class="metrics" style="grid-template-columns:1fr 1fr"><div class="metric"><span>Proteína</span><b>${M.pp}%</b></div><div class="metric"><span>Grasa</span><b>${M.gp}%</b></div><div class="metric"><span>HC</span><b>${M.cp}%</b></div><div class="metric"><span>Riesgo</span><b><span class="pill ${riskClass}">${risk()}</span></b></div></div><br><p class="footerwarn">Flujo: datos del paciente → objetivo → kcal/macros → equivalentes → distribución → menú → validación.</p>`}
function render(){renderTabs();renderPaciente();renderClinico();renderObjetivo();renderPlan();renderResumen();renderSide()} restore(); render();
</script>
</body>
</html>
